name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:   # everything except the real-browser tests: a few minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs -m "not browser"

  browser:   # the real-browser tests (marked in tests/conftest.py), in parallel with the job above: slower, software rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,browser]"
      - run: python -m playwright install --with-deps chromium
      # the browser tests need the MediaPipe models; Google's storage sometimes answers 401 to an anonymous download, so cache
      # them between runs and retry. If they still cannot be fetched, those tests skip and -rs says why.
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('src/realx/models.py') }}
      - name: Fetch the models (hash-verified), with retries
        run: |
          for attempt in 1 2 3 4; do
            realx models fetch
            if python -c "import sys; from realx.models import MANIFEST, models_dir; sys.exit(any(not (models_dir() / m.filename).is_file() for m in MANIFEST.values()))"; then exit 0; fi
            echo "some models are missing; retrying in $((attempt * 20)) s"; sleep $((attempt * 20))
          done
          echo "::warning::some models could not be fetched; the tests that need them will skip"
      - run: python -m pytest -q -rs -m browser

  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Committed bundles match a rebuild
        run: |
          npm run build
          if ! git diff --ignore-cr-at-eol --exit-code -- ../src/realx/web; then
            echo "::error::src/realx/web is stale: it does not match a rebuild from webapp/src. Run 'cd webapp && npm run build' and commit the result."
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- ../src/realx/web)" ]; then
            echo "::error::npm run build produced files not committed in src/realx/web. Run 'cd webapp && npm run build' and commit them."
            exit 1
          fi
      - run: npm audit
