# Builds the realX wheel and source archive, then has the OpenSSF SLSA generator sign
# a provenance file for them. Runs by hand or when a release is created.
# The generator is a third-party reusable workflow (not certified by GitHub); it is
# pinned to a release tag as its documentation requires for verification.
name: SLSA provenance

on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build tools
        run: python -m pip install build pytest scikit-image opencv-python-headless
      - name: Run the tests that need no model downloads
        run: python -m pip install -e . && python -m pytest -q
      - name: Build wheel and source archive
        run: python -m build
      - name: Hash the artifacts
        id: hash
        run: |
          set -euo pipefail
          cd dist
          echo "digests=$(sha256sum * | base64 -w0)" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v4
        with:
          name: realx-dist
          path: dist/
          if-no-files-found: error

  provenance:
    needs: [build]
    permissions:
      actions: read    # read the workflow path
      id-token: write  # sign the provenance
      contents: write  # attach it to a release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true
