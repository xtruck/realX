[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realx"
version = "0.1.0"
description = "Real-time face synthesis pipeline with built-in consent and provenance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.18"]
video = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8", "scikit-image>=0.22", "opencv-python-headless>=4.9"]
browser = ["playwright>=1.40"]   # only for the real-browser tests; then also run `python -m playwright install chromium` (or set REALX_CHROMIUM)

[project.scripts]
realx = "realx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"realx.web" = ["*.html", "*.js", "*.css", "avatars/*.vrm", "avatars/*.txt", "mp/*.txt", "mp/wasm/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
