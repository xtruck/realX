<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>realX character</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #badge { position: fixed; left: 10px; bottom: 8px; font: 12px/1.2 system-ui, sans-serif; color: #fff;
           background: rgba(12, 20, 27, .55); padding: 4px 8px; border-radius: 999px; pointer-events: none; }
  #lower { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 90%; text-align: center;
           font: 600 clamp(16px, 3.2vmin, 30px)/1.2 system-ui, sans-serif; color: #fff; background: rgba(12, 20, 27, .72);
           padding: 8px 18px; border-radius: 12px; pointer-events: none; }
  #lower b { display: block; } #lower span { display: block; font-weight: 400; font-size: .7em; opacity: .9; }
  /* camera preview for the person being tracked (?track=1&preview=1): shown to them only, never part of the stream */
  #cam { position: fixed; right: 10px; bottom: 8px; width: 24%; max-width: 220px; border-radius: 10px; background: #0c141b; box-shadow: 0 0 0 2px rgba(255,255,255,.5); }
  #cam.mirror { transform: scaleX(-1); }
  #trackstate { position: fixed; left: 10px; top: 8px; max-width: 70%; font: 12px/1.3 system-ui, sans-serif; color: #fff; background: rgba(12, 20, 27, .72); padding: 5px 10px; border-radius: 10px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Animated character"></canvas>
<div id="lower" hidden><b></b><span></span></div>
<div id="badge" hidden></div>
<video id="cam" hidden muted playsinline aria-label="Your camera, for checking your framing"></video>
<div id="trackstate" role="status" hidden></div>
<script src="/avatar.bundle.js"></script>
</body>
</html>
